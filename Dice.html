.game-container {
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

/* 4. Стили для числа и текста под ним */
.number-wrapper {
    text-align: center;
    margin-bottom: 30px;
    margin-top: 20px;
}
#number {
    font-size: 100px; 
    font-weight: 800;
    line-height: 1.2; /* Увеличили высоту строки, чтобы макушка не резалась */
    padding: 10px 0; /* Добавили отступы сверху и снизу */
    margin: 0;
    text-decoration: none !important;
    
    background: linear-gradient(180deg, #61A8FF 0%, #007AFF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.number-label {
    color: #8E8E93;
    font-size: 16px;
    margin-top: 10px;
    font-weight: 500;
}

/* 2. Плашка Меньше/Больше в стиле 1win */
.toggle-panel {
    display: flex;
    background-color: #1A1A1A; /* Темный фон плашки */
    border-radius: 16px;
    padding: 6px;
    width: 85%;
    margin-bottom: 40px;
}
.toggle-btn {
    flex: 1;
    text-align: center;
    color: #FFFFFF;
    padding: 14px 0;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}
.arrow {
    font-size: 14px;
    color: #8E8E93;
}
/* Активное состояние кнопки (светится синим) */
.toggle-btn.active-blue {
    background-color: rgba(97, 168, 255, 0.15);
    color: #61A8FF;
}
.toggle-btn.active-blue .arrow {
    color: #61A8FF;
}

/* 5. Кнопка "Получить сигнал" */
.action-container {
    width: 85%;
    height: 60px; /* Фиксированная высота, чтобы ничего не прыгало */
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
}
.glow-button {
    background-color: #007AFF;
    color: white;
    border: none;
    border-radius: 16px;
    padding: 18px 0;
    width: 100%;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;

<body>
 <div id="game" class="game-container">
    <!-- Выпавшее число -->
    <div class="number-wrapper">
        <div id="number">--</div>
        <div class="number-label">Выпавшее число</div>
    </div>

    <!-- Плашка Больше/Меньше -->
    <div class="toggle-panel">
        <div id="less-btn" class="toggle-btn">
            <span class="arrow">︾</span> Меньше
        </div>
        <div id="more-btn" class="toggle-btn">
            <span class="arrow">︽</span> Больше
        </div>
    </div>

    <!-- Кнопка и прогресс-бар -->
    <div class="action-container">
        <button id="rollButton" class="glow-button">Получить сигнал</button>
        
        <!-- Контейнер для загрузки (изначально скрыт) -->
        <div id="loading-container" style="display: none;">
            <div class="progress-bar-bg">
                <div id="timer-progress"></div>
            </div>
        </div>
    </div>

    <button class="back-button">Назад</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const gameBtn = document.getElementById('rollButton');
    const loadingContainer = document.getElementById('loading-container');
    const progressBar = document.getElementById('timer-progress');
    const numberEl = document.getElementById('number');
    
    // Элементы плашки
    const lessBtn = document.getElementById('less-btn');
    const moreBtn = document.getElementById('more-btn');

    // Кнопка назад (оставляем твою логику)
    const backBtn = document.querySelector('.back-button');
    if (backBtn) {
        backBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.history.back(); // Или твоя логика переключения экранов
        });
    }

    if (gameBtn) {
        gameBtn.addEventListener('click', () => {
            // Если есть Telegram API, добавляем вибрацию
            if (window.Telegram && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }

            // 1. Скрываем кнопку, показываем загрузку
            gameBtn.style.display = 'none';
            loadingContainer.style.display = 'block';
            loadingContainer.style.width = '100%';
            
            // Сбрасываем прошлые результаты
            lessBtn.classList.remove('active-blue');
            moreBtn.classList.remove('active-blue');
            progressBar.style.width = '0%';

            let progress = 0;
            
            // 3. Анимация перебора чисел (меняется каждые 50мс)
            const rollingInterval = setInterval(() => {
                numberEl.textContent = Math.floor(Math.random() * 90) + 10;
            }, 50);

            // Анимация заполнения бара (занимает ~1.5 секунды)
            const loadInterval = setInterval(() => {
                progress += 5; // Шаг загрузки
                progressBar.style.width = progress + '%';

                if (progress >= 100) {
                    clearInterval(loadInterval);
                    clearInterval(rollingInterval); // Останавливаем перебор чисел

                    // Генерируем финальное число (от 10 до 90)
                    const finalNum = Math.floor(Math.random() * 81) + 10;
                    numberEl.textContent = finalNum;

                    // Определяем Больше или Меньше
                    const isLess = Math.random() >= 0.5;

                    // Подсвечиваем нужную кнопку на плашке
                    if (isLess) {
                        lessBtn.classList.add('active-blue');
                    } else {
                        moreBtn.classList.add('active-blue');
                    }

                    // (Опционально) Возвращаем кнопку через 2 секунды, чтобы можно было получить новый сигнал
                    setTimeout(() => {
                        loadingContainer.style.display = 'none';
                        gameBtn.style.display = 'block';
                        progressBar.style.width = '0%';
                    }, 2000);
                }
            }, 75); // Скорость загрузки
        });
    }
});
</script>
