.progress-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: #4CAF50; transition: width 0.4s ease-in-out; }
.step { z-index: 1; font-weight: 800; color: white; font-size: 14px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
.goal-net { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; width: 95%; aspect-ratio: 5 / 3; background: rgba(255, 255, 255, 0.05); border: 4px solid rgba(255, 255, 255, 0.8); border-radius: 12px; padding: 10px; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
.cell { border: 2px dashed rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: all 0.2s; position: relative; }
.cell.ball { border: 2px solid transparent; }
.cell.ball::after { content: '⚽'; font-size: 40px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
.cell.target { border-color: #FF3B30; background: rgba(255, 59, 48, 0.2); }
.cell.target::after { content: '🎯'; font-size: 35px; animation: pulse 0.2s infinite alternate; }
.kick-btn { background: #D32F2F; color: white; border: none; padding: 15px 50px; font-size: 24px; font-weight: 900; border-radius: 30px; margin-top: 50px; text-transform: uppercase; box-shadow: 0 6px 0 #9A0007; cursor: pointer; transition: 0.1s; }
.kick-btn:active { transform: translateY(6px); box-shadow: none; }
.kick-btn:disabled { opacity: 0.5; cursor: not-allowed; }
@keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes pulse { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }
</style></head>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const kickBtn = document.getElementById('kickButton');
    const cells = document.querySelectorAll('.cell');
    const progressFill = document.getElementById('progress-fill');
    const backBtn = document.querySelector('.back-button');

    if (backBtn) {
        backBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.history.back();
        });
    }

    if (kickBtn) {
        kickBtn.addEventListener('click', () => {
            if (window.Telegram && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
            }
            kickBtn.disabled = true;
            cells.forEach(c => c.className = 'cell');
            progressFill.style.width = '0%';

            let currentStep = 0;
            const maxSteps = 5; 
            let availableCells = Array.from(Array(15).keys()); 

            function generateNextBall() {
                if (currentStep >= maxSteps) {
                    kickBtn.disabled = false; 
                    return;
                }
                let scanCount = 0;
                const scanInterval = setInterval(() => {
                    cells.forEach(c => c.classList.remove('target'));
                    
                    const randomScanIndex = Math.floor(Math.random() * 15);
                    if (!cells[randomScanIndex].classList.contains('ball')) {
                        cells[randomScanIndex].classList.add('target');
                    }

                    scanCount++;
                    if (scanCount > 6) {
                        clearInterval(scanInterval);
                        cells.forEach(c => c.classList.remove('target'));

                        const randomIndex = Math.floor(Math.random() * availableCells.length);
                        const cellIndex = availableCells[randomIndex];
                        availableCells.splice(randomIndex, 1); 

                        cells[cellIndex].classList.add('ball');
                        currentStep++;
                        progressFill.style.width = (currentStep * 20) + '%';
                        setTimeout(generateNextBall, 700);
                    }
                }, 150); 
            }
            generateNextBall();
        });
    }
});
</script>
