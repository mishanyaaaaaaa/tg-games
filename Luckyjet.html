    /* Фирменный глубокий темно-фиолетовый фон в цвет игры */

/* Добавляем динамические звезды */
    body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 300%; /* Увеличиваем, чтобы хватило для анимации */
        height: 300%;
        z-index: -1; /* Звезды ПОД игровым окном, но НАД фоновым градиентом */
        pointer-events: none; /* Чтобы не мешали кликам */

        /* Создаем "точки" разного размера */
        background-image: 
            radial-gradient(1px 1px at 25px 50px, #fff, rgba(0,0,0,0)),
            radial-gradient(1.5px 1.5px at 100px 300px, #fff, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 200px 100px, #fff, rgba(0,0,0,0)),
            radial-gradient(1.5px 1.5px at 300px 400px, #fff, rgba(0,0,0,0)),
            radial-gradient(1px 1px at 400px 200px, #fff, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 500px 500px, #fff, rgba(0,0,0,0)),
            radial-gradient(1.5px 1.5px at 600px 150px, #fff, rgba(0,0,0,0)),
            radial-gradient(1px 1px at 700px 350px, #fff, rgba(0,0,0,0));

        background-size: 
            150px 150px,
            250px 250px,
            300px 300px,
            400px 400px,
            350px 350px,
            500px 500px,
            450px 450px,
            600px 600px;

        animation: stars-move 180s linear infinite; /* Медленное, плавное движение */
        opacity: 0.6; /* Делаем звезды приглушенными */
    }

        /* Окно игры (обрезает шапку сверху и ставки снизу) */
        .game-wrapper {
            width: 350px; 
            height: 265px; /* УМЕНЬШИЛИ ВЫСОТУ, чтобы отрезать блок ставок */
            border-radius: 15px;
            overflow: hidden; 
            position: relative;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #1a1a24;
        }

        /* Сам фрейм игры внутри окна */
        iframe {
            width: 100%;
            height: 600px; /* Сделали с запасом, низ просто обрежется контейнером */
            margin-top: -65px; /* Оставляем этот сдвиг, чтобы по-прежнему прятать шапку с балансом */
            border: none; 
            pointer-events: none; 
        }

        /* Блок с кнопкой (вынесен ОТДЕЛЬНО от игры, чтобы не обрезался) */
        .controls {
            text-align: center;
            width: 350px;
            margin-top: 20px;
        }

        /* Стиль тестовой кнопки */
        #test-action-btn {
            width: 100%;
            padding: 14px 28px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff9900, #ff4500);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
            transition: transform 0.1s;
        }

        #test-action-btn:active {
            transform: scale(0.95);
        }

        /* Стиль плашки с результатом */
        #random-result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
            background-color: rgba(20, 20, 35, 0.8);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
/* Стиль оранжевой кнопки Назад в меню */
.back-btn {
    display: block;
    box-sizing: border-box;
    width: 180px; /* Сделали кнопку короче */
    margin-top: 80px; /* Отталкиваем кнопку сильно вниз от плашки ожидания */
    margin-bottom: 20px; /* Безопасный отступ от нижнего края экрана */
    margin-left: auto; /* Центрируем по горизонтали */
    margin-right: auto; /* Центрируем по горизонтали */
    padding: 14px 28px;
    background: linear-gradient(135deg, #ff9900, #ff4500);
    color: white;
    text-decoration: none; 
    font-size: 16px;
    border-radius: 10px;
    text-transform: uppercase;
    font-weight: 800;
    text-align: center;
    box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
    transition: transform 0.1s;
}

        .back-btn:active {

/* Анимация бесконечного движения */
@keyframes stars-move {
    from {
        background-position: 0 0;
    }
    to {

}

    <!-- 3. ЛОГИКА РАНДОМА -->
    <script>
        function getTestRandomResult() {
            const chance = Math.random();
            if (chance < 0.40) {
               const multiplier = (Math.random() * (5.0 - 1.5) + 1.5).toFixed(2);
               return { 
                   success: true, 
                   text: `Успех! Сигнал x${multiplier}`, 
                   color: '#4CAF50' 
               };
            } else {
               return { 
                   success: false, 
                   text: `Мимо. Ждем следующий...`, 
                   color: '#F44336' 
               };
            }
        }

        document.getElementById('test-action-btn').addEventListener('click', () => {
            const resultContainer = document.getElementById('random-result');
            const button = document.getElementById('test-action-btn');
            
            button.disabled = true;
            button.style.opacity = '0.7';
            resultContainer.innerText = 'Анализирую...';
            resultContainer.style.color = '#888';

            setTimeout(() => {
                const result = getTestRandomResult();
                resultContainer.style.color = result.color;
                resultContainer.innerText = result.text;
                button.disabled = false;
                button.style.opacity = '1';
            }, 600); 
        });
    </script>
