<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
<title>LUD SOFT - New Mines</title>
<style>
    :root {
        --background-page: #141415;
        --background-container-primary: #1D1E20;
        --background-container-elevated-secondary: #2E3035;
        --button-primary-up: #0075FF;
        --button-primary-hover: #1381FF;
        --button-rounding-button-m: 8px;
        --fg-content-inverted: #F0F2F5;
        --mines-star-linear-01: #4D9FFF;
        --mines-star-linear-02: #006EEC;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--background-page);
        color: var(--fg-content-inverted);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
    }

    .app-container {
        width: 100%;
        max-width: 400px;
        min-height: 100vh;
        background-color: var(--background-page);
        display: flex;
        flex-direction: column;
        padding: 16px;
        box-sizing: border-box;
    }

    /* Логотип 1win x MINES */
    .brand-title {
        background-color: var(--background-container-primary);
        text-align: center;
        padding: 12px;
        border-radius: var(--button-rounding-button-m);
        font-weight: 800;
        font-size: 18px;
        letter-spacing: 1px;
        margin-top: 20px;
        margin-bottom: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
    }
    .brand-title .onewin { color: #fff; font-style: italic; }
    .brand-title .onewin span { color: #0075FF; }

    /* Сетка игры */
    .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-bottom: 30px;
    }
    
    .cell {
        aspect-ratio: 1;
        background-color: var(--background-container-elevated-secondary);
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        transition: all 0.3s ease;
    }

    .cell.hidden::after {
        content: "1w";
        font-weight: 900;
        font-style: italic;
        font-size: 20px;
        color: rgba(255, 255, 255, 0.04);
    }

    /* Стили для Звезды */
    .star-icon {
        width: 65%;
        height: 65%;
        filter: drop-shadow(0 0 10px rgba(0, 117, 255, 0.6));
        animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        transform: scale(0);
    }

    @keyframes pop {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    /* Блок выбора бомб */
    .bombs-container {
        background-color: var(--background-container-primary);
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 20px;
    }
    
    .bombs-container p {
        margin: 0 0 12px 0;
        font-size: 14px;
        color: rgba(240, 242, 245, 0.7);
    }

    .bomb-buttons {
        display: flex;
        background: #141415;
        border-radius: 8px;
        padding: 4px;
    }

    .bomb-buttons button {
        flex: 1;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        padding: 10px 0;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .bomb-buttons button.active {
        background-color: var(--background-container-elevated-secondary);
    }

    /* Кнопка получения сигнала */
    .get-signal-btn {
        width: 100%;
        background-color: var(--button-primary-up);
        color: #fff;
        border: none;
        padding: 18px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
    }

    .get-signal-btn:active {
        background-color: var(--button-primary-hover);
        transform: scale(0.98);
    }

    /* Футер */
    .footer-info {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: rgba(255,255,255,0.5);
        margin-bottom: 20px;
    }

    .back-btn {
        background-color: #D32F2F;
        color: #fff;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin: 0 auto;
        display: block;
        transition: opacity 0.2s;
    }

    .back-btn:active {
        opacity: 0.8;
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- Заголовок -->
    <div class="brand-title">
        <span class="onewin">1<span>w</span>in</span> × MINES
    </div>

    <!-- Сетка -->
    <div class="grid" id="grid">
        <!-- Ячейки сгенерируются через JS -->
    </div>

    <!-- Выбор количества бомб -->
    <div class="bombs-container">
        <p>Number of bombs</p>
        <div class="bomb-buttons" id="bomb-selector">
            <button data-bombs="2">2</button>
            <button data-bombs="3" class="active">3</button>
            <button data-bombs="5">5</button>
            <button data-bombs="7">7</button>
        </div>
    </div>

    <!-- Кнопка Сигнала -->
    <button class="get-signal-btn" id="get-signal">
        Get Signal 
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff">
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
    </button>

    <!-- Подвал -->
    <div class="footer-info">
        <span>🛡 Provably fair <b>protected</b></span>
        <span>RTP <b>98%</b></span>
    </div>
    
    <!-- Кнопка Назад -->
    <button class="back-btn" id="go-back">Назад</button>
</div>

<script>
    // Настройки логики сигналов
    const signalRules = {
        2: 7,
        3: 5,
        5: 4,
        7: 3
    };

    let currentBombs = 3; 
    const grid = document.getElementById('grid');
    const bombSelector = document.getElementById('bomb-selector');
    const getSignalBtn = document.getElementById('get-signal');
    const goBackBtn = document.getElementById('go-back');

    const starSvg = `
        <svg class="star-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="star-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#4D9FFF" />
                    <stop offset="100%" stop-color="#006EEC" />
                </linearGradient>
            </defs>
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="url(#star-grad)"/>
        </svg>
    `;

    function initGrid() {
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell hidden';
            grid.appendChild(cell);
        }
    }

    bombSelector.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') {
            Array.from(bombSelector.children).forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            currentBombs = parseInt(e.target.getAttribute('data-bombs'));
            initGrid();
        }
    });

    getSignalBtn.addEventListener('click', () => {
        initGrid();
        const cells = document.querySelectorAll('.cell');
        const starsToOpen = signalRules[currentBombs];
        
        const positions = new Set();
        while (positions.size < starsToOpen) {
            positions.add(Math.floor(Math.random() * 25));
        }

        let delay = 0;
        positions.forEach(pos => {
            setTimeout(() => {
                cells[pos].classList.remove('hidden');
                cells[pos].innerHTML = starSvg;
            }, delay);
            delay += 100; 
        });
    });

    // --- ОБНОВЛЕННАЯ ЛОГИКА КНОПКИ "НАЗАД" ---
    goBackBtn.addEventListener('click', () => {
        // Укажи здесь название файла твоего главного меню вместо 'index.html', если оно другое
        window.location.href = 'index.html'; 
    });

    initGrid();
</script>

</body>
</html>
