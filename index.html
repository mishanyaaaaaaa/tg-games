<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;font-family:Arial,sans-serif;background:#121212;color:#ffffff;overflow-x:hidden;padding-top:10px}.stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}.star{position:absolute;background:rgb(46,72,216);border-radius:50%;opacity:0.8}@keyframes twinkle{0%,100%{opacity:0.2}50%{opacity:1}}.container{position:relative;z-index:1;width:90%;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding:20px;justify-items:center}@media (min-width:768px){.container{grid-template-columns:repeat(2,1fr)}}.game-card{border-radius:40px;padding:15px;display:flex;animation:cardTwinkle 3s ease-in-out infinite;flex-direction:column;align-items:center;backdrop-filter:blur(5px);transition:all 0.3s ease;border:1px solid rgba(255,255,255,0.1);width:100%;max-width:220px}.game-card:hover{transform:translateY(-5px);box-shadow:0 0 15px rgba(0,255,255,0.3);border-color:rgba(0,255,255,0.2)}.game-image{width:100%;height:auto;aspect-ratio:1/1;margin-bottom:15px;object-fit:cover;transition:transform 0.3s ease}.game-card:hover .game-image{transform:scale(1.05)}.play-button{color:white;border:none;width:100%;padding:8px 0;cursor:pointer;font-size:16px;text-decoration:none;text-transform:uppercase;letter-spacing:1px;font-weight:bold;text-align:center;transition:all 0.3s ease}.play-button:hover{background:#2e787d;box-shadow:0 0 15px rgba(76,147,175,0.4)}.top-bar{position:relative;top:0;left:0;width:100%;height:auto;display:flex;align-items:center;justify-content:space-between;padding:0 40px;z-index:1000;background:transparent}.device-info{padding:8px 15px;height:40px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px);transition:all 0.3s ease}.language-switcher:hover,.device-info:hover{background:rgba(255,255,255,0.15)}.device-info-text{color:white;font-size:16px;font-weight:bold;line-height:40px;margin-left:8px;vertical-align:middle}.l } else {

}
// === ЛОГИКА КНОПКИ ЯЗЫКА И ПЕРЕВОДА ===

// 1. Открытие / Закрытие меню
function toggleLangMenu(event) {
    if (event) event.stopPropagation();
    const menu = document.getElementById('lang-options');
    
    if (menu) {
        const isClosed = menu.style.opacity === '0' || menu.style.opacity === '';
        if (isClosed) {
            menu.style.opacity = '1';
            menu.style.transform = 'scaleY(1)';
            menu.style.pointerEvents = 'auto';
        } else {
            menu.style.opacity = '0';
            menu.style.transform = 'scaleY(0)';
            menu.style.pointerEvents = 'none';
        }
    }
}

// 2. Выбор языка из списка
function selectLanguage(langCode) {
    console.log("Выбран язык:", langCode);
    
    // Закрываем меню
    const menu = document.getElementById('lang-options');
    if (menu) {
        menu.style.opacity = '0';
        menu.style.transform = 'scaleY(0)';
        menu.style.pointerEvents = 'none';
    }
    
    // Применяем перевод
    switchLanguage(langCode);
}

// 3. Закрытие меню при клике в любое другое место
document.addEventListener('click', function(e) {
    const menu = document.getElementById('lang-options');
    const btn = document.getElementById('lang-btn');
    
    if (menu && btn && !btn.contains(e.target) && !menu.contains(e.target)) {
        menu.style.opacity = '0';
        menu.style.transform = 'scaleY(0)';
        menu.style.pointerEvents = 'none';
    }
});

// 4. Словарь переводов
const translations = {
    'ru': { device_name: 'Айфон', open_btn: 'ОТКРЫТЬ' },
    'en': { device_name: 'iOS', open_btn: 'OPEN' },
    'hi': { device_name: 'iOS', open_btn: 'खोलें' },
    'es': { device_name: 'iOS', open_btn: 'ABRIR' },
    'pt': { device_name: 'iOS', open_btn: 'ABRIR' },
    'tr': { device_name: 'iOS', open_btn: 'AÇ' },
    'ar': { device_name: 'اي او اس', open_btn: 'افتح' },
    'uz': { device_name: 'iOS', open_btn: 'OCHISH' },
    'az': { device_name: 'iOS', open_btn: 'AÇ' }
};

// 5. Функция смены текста на странице
function switchLanguage(langCode) {
    const t = translations[langCode] || translations['en'];

    // Переводим все элементы с атрибутом data-i18n
    document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.getAttribute('data-i18n');
        if (t[key]) {
            element.innerText = t[key];
        }
    });

    // Направление текста справа-налево для арабского
    if (langCode === 'ar') {
        document.documentElement.dir = 'rtl';
    } else {
        document.documentElement.dir = 'ltr';
    }

    // Сохраняем в память браузера
    localStorage.setItem('user_language', langCode);
}

// 6. Загрузка сохраненного языка при старте
document.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('user_language') || 'ru';
    switchLanguage(savedLang);
});
// === АВТООПРЕДЕЛЕНИЕ УСТРОЙСТВА ПРИ ВХОДЕ ===
document.addEventListener('DOMContentLoaded', () => {
    const deviceTextElement = document.getElementById('device-text');
    if (!deviceTextElement) return;

    const tg = window.Telegram?.WebApp;
    const platform = tg?.platform || ''; // Платформа из Telegram
    const ua = navigator.userAgent;      // Проверка через браузер

    let deviceName = 'ПК';

    if (platform === 'ios' || /iPhone|iPad|iPod/i.test(ua)) {
        deviceName = 'Айфон';
    } else if (platform === 'android' || /Android/i.test(ua)) {
        deviceName = 'Андроид';
    } else {
        deviceName = 'ПК';
    }

    deviceTextElement.innerText = deviceName;
});
const mainSection = document.getElementById("main-section");
const profileSection = document.getElementById("profile-section");

document.querySelectorAll(".play-button").forEach(button => {
    button.addEventListener("click", () => {
        const card = button.closest(".game-card");
        let gameName = "Игра";
        if (card) {
            const img = card.querySelector("img");
            if (img) gameName = img.alt || "Игра";
        }

        let stats = JSON.parse(localStorage.getItem("user_game_stats") || "{}");
        stats[gameName] = (stats[gameName] || 0) + 1;
        
        let total = parseInt(localStorage.getItem("total_launches") || "0") + 1;
        localStorage.setItem("total_launches", total);
        
        let today = new Date().toDateString();
        let lastDate = localStorage.getItem("signals_date");
        let todayCount = parseInt(localStorage.getItem("signals_today") || "0");
        
        if (lastDate !== today) {
            todayCount = 1;
            localStorage.setItem("signals_date", today);
        } else {
            todayCount += 1;
        }
        localStorage.setItem("signals_today", todayCount);
        localStorage.setItem("user_game_stats", JSON.stringify(stats));
    });
});

// --- 2. ПЕРЕКЛЮЧЕНИЕ НА ГЛАВНУЮ ---
function showMain() {
    const mainSection = document.getElementById("main-section");
    const profileSection = document.getElementById("profile-section");
    const topBar = document.getElementById("top-bar");
    const btnHome = document.getElementById("btn-home");
    const btnProfile = document.getElementById("btn-profile");

    // Показываем верхние плашки и главную страницу
    if (topBar) topBar.classList.remove("hidden");
    if (profileSection) profileSection.classList.add("hidden");
    
    if (mainSection) {
        mainSection.classList.remove("hidden");
        mainSection.removeAttribute("style");
    }

    // Подсветка кнопок
    if (btnHome) btnHome.style.cssText = "background: rgba(255, 215, 0, 0.1); border: 1px solid #FFD700; color: #FFD700; font-weight: bold; padding: 6px 12px; cursor: pointer; border-radius: 20px; font-size: 11px; white-space: nowrap;";
    if (btnProfile) btnProfile.style.cssText = "background: none; border: 1px solid transparent; color: #ffffff; font-weight: bold; padding: 6px 12px; cursor: pointer; border-radius: 20px; font-size: 11px; white-space: nowrap;";
}

// --- 3. ПЕРЕКЛЮЧЕНИЕ НА ПРОФИЛЬ ---
function showProfile() {
    const mainSection = document.getElementById("main-section");
    const profileSection = document.getElementById("profile-section");
    const topBar = document.getElementById("top-bar");
    const btnHome = document.getElementById("btn-home");
    const btnProfile = document.getElementById("btn-profile");

    // Скрываем верхнюю панель и главную, чтобы меню поднялось на самый верх!
    if (topBar) topBar.classList.add("hidden");
    if (mainSection) mainSection.classList.add("hidden");
    if (profileSection) profileSection.classList.remove("hidden");

    if (typeof updateProfileStats === "function") updateProfileStats();

    // Подсветка кнопок
    if (btnProfile) btnProfile.style.cssText = "background: rgba(255, 215, 0, 0.1); border: 1px solid #FFD700; color: #FFD700; font-weight: bold; padding: 6px 12px; cursor: pointer; border-radius: 20px; font-size: 11px; white-space: nowrap;";
    if (btnHome) btnHome.style.cssText = "background: none; border: 1px solid transparent; color: #ffffff; font-weight: bold; padding: 6px 12px; cursor: pointer; border-radius: 20px; font-size: 11px; white-space: nowrap;";
}
